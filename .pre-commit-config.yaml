repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff lint (scripts/)
        entry: /home/users/hikaru.inoue/.venv_aarch64/bin/ruff check scripts --fix
        language: script
        types: [python]
        stages: [pre-commit]
        pass_filenames: false
      - id: pytest
        name: pytest (tests/)
        entry: /home/users/hikaru.inoue/.venv_aarch64/bin/python3 -m pytest tests/ -x --ignore=tests/argus/test_agent_tools.py -m "not slow"
        language: script
        types_or: [python, shell, yaml]
        stages: [pre-commit]
        pass_filenames: false
      - id: mypy
        name: mypy (argus/)
        entry: /home/users/hikaru.inoue/.venv_aarch64/bin/mypy scripts/argus/ --exclude scripts/argus/patrol/
        language: script
        types: [python]
        stages: [manual]
        pass_filenames: false
      - id: no-box-open-company-access
        # 検出範囲の限界（既知）: 改行で分割された `"--access",` / `"open",`、
        # `--access=open` 形式、シングルクォート、変数間接指定（例: `["--access", ACC]`）は
        # このリテラル grep では検出できない。特に変数間接指定は box_cli.py の
        # BOX_SHARED_LINK_ACCESS 定数実装そのものの形であり、そこは
        # tests/utils/test_box_cli.py のリテラル比較（実引数列のアサーション）で担保する。
        # grep は「マッチ無し(exit=1)」のときだけ PASS。マッチあり(0)・実行エラー(>=2)は
        # いずれも FAIL とし、`!` による fail-open（ディレクトリ不在等でも exit=0 になる
        # 事象）を避ける。
        name: box share access lint (scripts/, best-effort literal grep)
        entry: >-
          bash -c '
          grep -rnE -- "--access[\"]?,?\s*[\"]?(open|company)" scripts/;
          rc=$?;
          if [ "$rc" -eq 1 ]; then exit 0; else exit 1; fi
          '
        language: system
        stages: [pre-commit]
        always_run: true
        pass_filenames: false
      - id: net-guard-import-required
        # requests / urllib / slack_sdk を import しているファイルは、必ず net_guard
        # （または net_guard を import 済みのハブモジュール db_utils/cli_utils/llm/
        # canvas_utils/narrate のいずれか）を import していなければならない
        # （scripts/utils/net_guard.py 参照）。
        #
        # 既知の例外（除外パス）:
        #   - scripts/eval/ 配下: 開発用の評価ツールであり、本番の実行経路ではない
        # （pm_web_fetch.py の除外は 2026-08-01 の削除に伴い不要になった。§4.5）
        #
        # 検出範囲の限界（既知）: grep によるファイル内文字列一致であり、実際に
        # import 文として解釈できるかは見ない。コメント中の言及だけでも誤って
        # PASS しうる。特に narrate.py / canvas_utils.py は自分自身のファイル名を
        # docstring に含むため、この lint は自己言及だけで PASS してしまいうる
        # （net_guard import の有無は別途レビューで確認すること）。
        # grep は「マッチ無し(exit=1)」のときだけ対象ファイル無しとして扱い、
        # マッチあり(0)は個別ファイルを検査、実行エラー(>=2)は FAIL とする
        # （no-box-open-company-access と同じ fail-closed 方針）。
        name: net_guard import lint (scripts/, requests/urllib/slack_sdk 使用箇所)
        entry: >-
          bash -c '
          net_users=$(grep -rlE "^[[:space:]]*(import requests\b|from requests\b|import urllib\b|import urllib\.|from urllib\.|import slack_sdk\b|from slack_sdk\b)" scripts --include="*.py");
          rc=$?;
          if [ "$rc" -ge 2 ]; then echo "[net-guard-lint] grep 実行エラー"; exit 1; fi;
          fail=0;
          for f in $net_users; do
            case "$f" in
              scripts/eval/*) continue ;;
            esac;
            if ! grep -qE "net_guard|db_utils|cli_utils|canvas_utils|\bllm\b|\bnarrate\b" "$f"; then
              echo "[net-guard-lint] net_guard (または hub モジュール) の import が無い: $f";
              fail=1;
            fi;
          done;
          exit $fail
          '
        language: system
        stages: [pre-commit]
        always_run: true
        pass_filenames: false
      - id: no-slack-id-literals
        # scripts/ tests/ docs/ 配下（git 管理下ファイルのみ。docs/project.md 等の
        # gitignore 対象は対象外）に Slack ID 形式（channel = C.../ user = U.../
        # canvas = F.../ group = G... + 英数字8文字以上）の直書きが無いことを確認する。
        # 実値は必ず data/argus_config.yaml 経由で参照し、コードには置かない。
        #
        # 既知の例外（誤検知）:
        #   - [CUFG]0X+ / [CUFG]0Y+ （例: C0XXXXXXX, F0YYYYYYY）:
        #     ドキュメント・docstring 用のプレースホルダ表記
        #   - GMT[0-9]{8} : Zoom 録画ファイルの自動タイムスタンプ prefix
        #     （例: GMT20260302-032528_Recording.mp4）。Slack ID ではない
        #   - CONTRADICTS : scripts/argus/patrol/detect.py の LLM 判定キーワード
        #     （C + 大文字10文字が偶然パターンに一致するだけ）
        #   - USLACKBOT : Slack が全ワークスペース共通で予約する Bot user_id
        #     （プロジェクト固有の秘匿情報ではない）
        #
        # 検出範囲の限界（既知）: リテラル文字列としての grep 一致であり、
        # コメント・docstring・実引数の区別はしない。fail-closed 方針は他の
        # lint（no-box-open-company-access 等）と同じ: マッチ無し(exit=1)のみ
        # PASS、マッチあり(0)・実行エラー(>=2)はいずれも FAIL とする。
        name: no Slack ID literals (scripts/, tests/, docs/)
        entry: >-
          bash -c '
          mapfile -t files < <(git ls-files -- scripts tests docs);
          if [ "${#files[@]}" -eq 0 ]; then
            echo "[slack-id-lint] git ls-files の結果が空でした（想定外のためFAIL）";
            exit 1;
          fi;
          out=$(grep -nHoE "\b[CUFG][0-9A-Z]{8,}\b" -- "${files[@]}" 2>&1);
          rc=$?;
          if [ "$rc" -ge 2 ]; then
            echo "[slack-id-lint] grep 実行エラー: $out";
            exit 1;
          fi;
          if [ "$rc" -eq 1 ]; then
            exit 0;
          fi;
          leaked=$(printf "%s\n" "$out" \
            | grep -vE ":[CUFG]0[XY]+\$" \
            | grep -vE ":GMT[0-9]{8}\$" \
            | grep -vE ":CONTRADICTS\$" \
            | grep -vE ":USLACKBOT\$");
          if [ -n "$leaked" ]; then
            echo "[slack-id-lint] Slack ID らしき文字列が検出されました。data/argus_config.yaml からの参照に置き換えるか、プレースホルダ（例: C0XXXXXXX）にしてください:";
            echo "$leaked";
            exit 1;
          fi;
          exit 0
          '
        language: system
        stages: [pre-commit]
        always_run: true
        pass_filenames: false
      - id: no-mcp-server-registration
        # MCP Server（旧 pm_mcp_server.py / FastMCP "pm-multi-agent"）は 2026-07-31 に
        # 廃止した。READ ツールと EGRESS ツールが同一プロセスに同居する唯一の経路であり、
        # かつ pm.db・議事録・Slack 本文が Claude に渡る経路でもあったため
        # （docs/security-architecture.md §3.3・§4.1、LOG.md）。
        #
        # 以下 3 つのいずれかが現れたら FAIL とし、再登録・再実装を機械的に止める:
        #   1. `.mcp.json`（Claude Code のプロジェクトスコープ MCP 定義）の新設
        #   2. .claude/settings*.json への `mcpServers` キーの追加
        #   3. scripts/ 配下での `@mcp.tool()` / `FastMCP(` の使用
        #
        # 検出範囲の限界（既知）: ユーザースコープの登録（~/.claude.json /
        # `claude mcp add`）はリポジトリ外なので検出できない。他の MCP サーバを
        # 意図して導入する場合は、この hook を外す判断そのものをレビュー対象にする。
        name: no MCP server registration (retired 2026-07-31)
        entry: >-
          bash -c '
          fail=0;
          if [ -e .mcp.json ]; then
            echo "[mcp-lint] .mcp.json が存在します（MCP 経路は廃止済み）";
            fail=1;
          fi;
          for f in .claude/settings.json .claude/settings.local.json; do
            if [ -f "$f" ] && grep -q "mcpServers" "$f"; then
              echo "[mcp-lint] $f に mcpServers があります（MCP 経路は廃止済み）";
              fail=1;
            fi;
          done;
          out=$(grep -rnE "@mcp\.tool|FastMCP\(" scripts --include="*.py");
          rc=$?;
          if [ "$rc" -ge 2 ]; then echo "[mcp-lint] grep 実行エラー"; exit 1; fi;
          if [ "$rc" -eq 0 ]; then
            echo "[mcp-lint] scripts/ に MCP ツール定義があります（廃止済み）:";
            echo "$out";
            fail=1;
          fi;
          exit $fail
          '
        language: system
        stages: [pre-commit]
        always_run: true
        pass_filenames: false
