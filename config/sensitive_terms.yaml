# config/sensitive_terms.yaml
#
# 第2系統（独立系統）を当てる対象を絞るためのフラグ語（docs/security-architecture.md §4.9 対策5）。
#
# ★ なぜ全件ではなくフラグ付き項目だけなのか ★
#
# 利用できる非中国系モデルは 17B / 12B と小さく、全件に当てると**能力差による不一致が
# 支配的**になって、探している信号が埋もれる。**懸念しているのは平均的な性能差ではなく、
# 特定の語で挙動が変わるという条件付きの偏り**（CAISI / CrowdStrike が観測したのはこれ）。
# 弱いモデルでもその条件は共有していないので、**トリガ付き入力での不一致こそが信号**になる。
#
# 件数が小さければ不一致を人間が全部見られる。能力差による雑音は人手で落とせる。
#
# ここに挙げるのは「политически 機微そう」な語ではなく、**トリガになりうる語**である。
# 増やしすぎると全件に近づき、上の利点が消える。追加するときは件数への影響を見ること。

# 第2系統に使うモデル（RiVault 配信、非中国系）。
# model_pin.yaml の宣言と一致していること。
second_opinion:
  model: "meta-llama/Llama-4-Scout-17B-16E-Instruct"
  fallback_model: "gemma3:12b"
  # 1回の実行でこの件数を超えたらフラグ語が広すぎる可能性が高い。警告を出す。
  max_flagged_per_run: 30

  # ★★ 第2系統は保留中（2026-08-04、PM 判断）★★
  #
  # **これは「R8 対策が無い」ことを意味する。** 保留を解くまで、主系統
  # （Zhipu / DeepSeek / Alibaba / Moonshot＝すべて同系統）に対する独立系統は存在しない。
  # 「実装済み」と読まないこと。
  #
  # 保留の理由: Scout（Llama-4-Scout-17B-16E）は役割に耐えなかった。2026-08-04 実測、
  # 同一会議・同一 VTT:
  #   ① 応答形式を守らない（{"content":...} を指示しても素の文字列配列を返す。
  #      この形式逸脱で議事録経路の第2系統は**一度も所見を記録できていなかった**）
  #   ② ASR 誤認識を復元できない（K3 が NVIDIA / cuFFT / KDDI と読んだ箇所を
  #      「Nビディア」「クーエフエフティー」「kdi」のまま出す）
  #   ③ 記録された 10 件すべてが3ゲート審査で DROP（話者名混入・中身のない項目を含む）
  # つまり**置いてあるが実質的に何も言っていない**状態だった。
  #
  # PM 判断: GLM-5.2 / Kimi-K3 に相当する能力を持ち、かつ出自が主系統の外にあるモデルが
  # 現時点で無い。**能力の足りないモデルを置いて「対策済み」にするより、無いと認めて
  # 保留する。**
  #
  # 保留を解く条件（いずれか）:
  #   - 出自が主系統の外で、GLM-5.2 / K3 相当の読解力を持つモデルが配信される
  #     （候補: RiVault 自製の RiVault-Reasoning-Large 等＝出自が運用主体自身で最も独立。
  #      K2-Think＝UAE 系と読める。いずれも未検証。model_pin.yaml の observed_not_used 参照）
  #   - Scout 自身を同条件で測り直して①〜③が解消する（max_tokens=1024 で打ち切られて
  #     いる可能性は未検証。K3 は 1024 では 0 文字だった）
  #
  # 保留中の挙動: 第2系統を呼ぶ経路（議事録欠落検査の --reader second / Slack Pass 1 抽出 /
  # Box relevance）は**LLM を呼ばずに WARN を出して飛ばす**。黙って 0 件を返して
  # 「不一致なし」に見せない。pm_selfcheck の second_opinion_on_hold が毎回報告し、
  # 保留が忘れられて恒久的に欠けた対策になるのを防ぐ。
  on_hold:
    since: "2026-08-04"
    decided_by: "PM"
    reason: >-
      Scout は役割に耐えず（形式逸脱・ASR誤認識の非復元・3ゲート審査で全件DROP）、
      GLM-5.2 / Kimi-K3 に相当する能力で出自が主系統の外にあるモデルが現時点で無い。
      能力の足りないモデルで「対策済み」にせず、無いと認めて保留する。

# 議事録欠落検出（pm_screen.py --second-opinion-minutes --reader k3）専用の「読み手」モデル。
# **R8 の第2系統（上の second_opinion）とは別物である。** K3（Moonshot）は主系統の
# glm/DeepSeek/Qwen と同じく本番経路の主要モデルが一系統に寄っている構図の外には出られない
# ため、出自の独立性という意味では second_opinion の代替にはならない。
# ここで使うのは K3 の読解・網羅（recall）の高さのみで、議事録を「書かせず」に
# 保存済みの決定事項・アクションアイテムに無い項目を探す読み手として使う
# （議事録生成に K3 を採用しない理由は用語一致率・所要時間・失敗率の実測、docs/kimi-k3-migration.md
# 「実測との突合」節参照）。model_pin.yaml の kimi-k3 は production: false（評価用）のまま。
quality_reader:
  model: "kimi-k3"

# 地政学・国・組織。トリガとして観測例のある領域に絞る。
terms:
  geopolitical:
    - 中国
    - 中国製
    - 台湾
    - 香港
    - 新疆
    - ウイグル
    - チベット
    - 南シナ海
    - 尖閣
    - 一帯一路
  export_control:
    - 輸出規制
    - 輸出管理
    - エンティティリスト
    - EAR
    - 安全保障貿易
    - 経済安全保障
    - デュアルユース
  vendor:
    - Moonshot
    - DeepSeek
    - Alibaba
    - Huawei
    - SMIC
    - ZTE
    - Tencent
    - Baidu
  # 英語表記も拾う（議事録・Slack は日英混在する）
  geopolitical_en:
    - China
    - Chinese
    - Taiwan
    - Hong Kong
    - Xinjiang
    - Uyghur
