# config/model_pin.yaml
#
# 供給網の固定（docs/security-architecture.md §4.6）。
# 「どのモデルを本番経路で使ってよいか」を宣言する allow-list。
#
# ★ 検証できるものと、申告にすぎないものを分けて書く ★
#
#   verified 系   — Argus 側で確認できる。`/v1/models` の id と照合する。
#                   不一致なら enforce で起動を拒否する（fail-closed）
#   declared 系   — **Argus 側では検証できない。** OpenAI 互換の `/v1/models` は
#                   id しか返さないため、チェックポイントの sha も trust_remote_code の
#                   設定も取得できない。**運用主体の申告を記録しているだけ**であり、
#                   「検証済み」と読んではいけない（§4.6 の警告、R12）
#
# 申告値が変われば git の diff に現れる。これが実質的な変更検知になる。
# モデル更新の通知を運用主体から受ける取り決めは Phase 0 の宿題（技術ではなく合意で埋める）。
#
#   verified_max_input_tokens / verified_max_output_tokens — こちらも verified 系。
#     `/v1/models` が返す max_input_tokens / max_output_tokens と照合する
#     （model_pin.py --check / pm_selfcheck.py の model_pin_drift 検査）。
#     API がこの項目を返さないエンドポイント（RiVault の一部・embedding 等）は null にし、
#     照合をスキップする。
#     ★限界: id 単独より強い指紋にすぎない。文脈長が同じ別モデルへの差し替えは
#     通ってしまう。同一性の証明ではない。
#
# モード切り替え: 環境変数 ARGUS_MODEL_PIN
#   warn (既定) — pin に無いモデルでも通す。ログに残すだけ
#   enforce     — pin に無い / verified_at が null のモデルは PermissionError で拒否
#   off         — 照合しない（テスト用）
#
# 運用手順:
#   1. `python3 scripts/utils/model_pin.py --list` で宣言内容を確認
#   2. `python3 scripts/utils/model_pin.py --check` で `/v1/models` の id と突き合わせる
#   3. warn で運用して差分がゼロになったら enforce へ

models:
  # --- 本番の主経路 -------------------------------------------------------
  # ★R8（集中リスク）について、2026-08-03 時点の全体像 ★
  #
  # 本番経路の主要モデルは glm-5.2（Zhipu）/ DeepSeek-V4-Flash（DeepSeek）/
  # qwen3.6-35b・Qwen3.6-35B（Alibaba）で、**すべて同系統の供給元**である。
  # R8 が想定しているのは個々のモデルの善悪ではなく「依存が一系統に寄っていること」なので、
  # **この構成では R8 は緩和されていない。**
  # 緩和にあたるのは第2系統（Llama-4-Scout / gemma3）だけで、それも
  # config/sensitive_terms.yaml のフラグ語が立った項目にしか当たらない（全件ではない）。
  # 「pin が全部 ok だから供給網は健全」と読まないこと（P10）。

  glm-5.2:
    role: "investigate / brief / risk の主モデル（RIKYU）"
    served_model_name: glm-5.2
    endpoint_env: [RIKYU_URL, LOCAL_LLM_URL, ARGUS_ONESHOT_LLM_URL]
    token_env: [RIKYU_TOKEN, LOCAL_LLM_TOKEN]
    production: true
    verified_at: "2026-08-01"      # model_pin.py --check で id 一致を確認
    verified_by: "model_pin.py --check"
    verified_max_input_tokens: 1000000    # /v1/models 実測（2026-08-01）
    verified_max_output_tokens: 1048576
    declared_revision: null     # 取得手段が無い。運用主体から聞いて記録する
    declared_weights_format: safetensors
    declared_trust_remote_code: false
    declared_engine: vllm
    declared_by: null
    declared_at: null

  Kimi-K2-Thinking:
    # 2026-08-03 に PM 判断で退役: thinking のログが応答に滲み出して使いものにならず、
    # RiVault 経由の議事録生成・Slack 抽出・トリアージから外した。エントリは削除せず
    # production: false で残す（かつて本番で使っていた記録・再検討時の参照のため）。
    role: "退役（RiVault 経由の議事録生成・Slack 抽出・トリアージの旧主モデル。2026-08-03廃止）"
    served_model_name: Kimi-K2-Thinking
    endpoint_env: [RIVAULT_URL]
    token_env: [RIVAULT_TOKEN]
    production: false
    # R8: K3 と同一提供元（Moonshot）であり、かつ R5（改竄）の発生場所を担う集中リスク。
    # 第2系統の投入（Phase 4）が未着手であることを承知の上で使っていた。
    #
    # ★訂正（2026-08-03）: 「退役により R8 は解消」と書いたが**誤り**。
    # R8 は「特定の供給元系統に依存が集中していること」であって、個々のモデルの性質ではない。
    # 退役後の本番構成は glm-5.2（Zhipu）/ DeepSeek-V4-Flash（DeepSeek）/
    # qwen3.6-35b・Qwen3.6-35B（Alibaba）で、**本番経路の主要モデルは依然すべて同系統**である。
    # 集中リスクは解消したのではなく**移動した**。緩和しているのは第2系統
    # （Llama-4-Scout / gemma3）だけで、それもフラグ語が立った項目にしか当たらない。
    concentration_risk: R8
    verified_at: "2026-08-03"
    verified_by: "model_pin.py --check"
    # RiVault の /v1/models は max_input_tokens/max_output_tokens を返さない（2026-08-01実測）。
    verified_max_input_tokens: null
    verified_max_output_tokens: null
    declared_revision: null
    declared_weights_format: safetensors
    declared_trust_remote_code: false
    declared_engine: vllm
    declared_by: null
    declared_at: null

  bge-m3:
    role: "埋め込み（ローカル vLLM, port 8001）"
    served_model_name: BAAI/bge-m3
    endpoint_env: [EMBED_API_BASE]
    token_env: [EMBED_API_KEY, LOCAL_LLM_TOKEN]
    production: true
    verified_at: "2026-08-01"
    verified_by: "model_pin.py --check"
    # embedding の /v1/models も max_input_tokens/max_output_tokens を返さない（2026-08-01実測）。
    verified_max_input_tokens: null
    verified_max_output_tokens: null
    declared_revision: null
    declared_weights_format: safetensors
    declared_trust_remote_code: false
    declared_engine: vllm
    declared_by: null
    declared_at: null

  DeepSeek-V4-Flash:
    # 訂正: 2026-08-03 に PM から「RiVault の本番モデルは DeepSeek-V4-Flash である」との
    # 回答があり判明。旧 role「オフライン評価の judge（scripts/eval/ 配下のみ。pm.db に
    # 欠落を作れない）」は誤りだった — 実際には RIVAULT_MODEL がこのモデルに設定されており
    # llm.py の _try_rivault（model 引数を渡さず RIVAULT_MODEL を使う）経由で本番の
    # 議事録生成・Slack 抽出・トリアージを担っていた。pm.db に欠落を作れない、は事実誤認。
    role: "RiVault 経由の議事録生成・Slack 抽出・トリアージの主モデル"
    served_model_name: deepseek-ai/DeepSeek-V4-Flash
    endpoint_env: [RIVAULT_URL]
    token_env: [RIVAULT_TOKEN]
    production: true
    verified_at: "2026-08-03"
    verified_by: "model_pin.py --check"
    # RiVault の /v1/models は max_input_tokens/max_output_tokens を返さない（2026-08-01実測）。
    verified_max_input_tokens: null
    verified_max_output_tokens: null
    declared_revision: null
    declared_weights_format: safetensors
    declared_trust_remote_code: false
    declared_engine: vllm
    declared_by: null
    declared_at: null

  # --- 第2系統（R8対策。config/sensitive_terms.yaml の second_opinion） -----
  Llama-4-Scout-17B-16E-Instruct:
    role: "R8 対策の第2系統（非中国系の独立系統）。主系統の判定を上書きせず不一致を記録する"
    served_model_name: meta-llama/Llama-4-Scout-17B-16E-Instruct
    endpoint_env: [RIVAULT_URL]
    token_env: [RIVAULT_TOKEN]
    production: true
    verified_at: "2026-08-03"
    verified_by: "model_pin.py --check"
    # RiVault の /v1/models は max_input_tokens/max_output_tokens を返さない（2026-08-03実測）。
    verified_max_input_tokens: null
    verified_max_output_tokens: null
    declared_revision: null
    declared_weights_format: null
    declared_trust_remote_code: null
    declared_engine: null
    declared_by: null
    declared_at: null

  gemma3:12b:
    role: "R8 対策の第2系統のフォールバック（非中国系の独立系統）。主系統の判定を上書きせず不一致を記録する"
    served_model_name: gemma3:12b
    endpoint_env: [RIVAULT_URL]
    token_env: [RIVAULT_TOKEN]
    production: true
    verified_at: "2026-08-03"
    verified_by: "model_pin.py --check"
    # RiVault の /v1/models は max_input_tokens/max_output_tokens を返さない（2026-08-03実測）。
    verified_max_input_tokens: null
    verified_max_output_tokens: null
    declared_revision: null
    declared_weights_format: null
    declared_trust_remote_code: null
    declared_engine: null
    declared_by: null
    declared_at: null

  # --- OCR（マルチモーダル。glm-5.2 は非マルチモーダルのため分離） -----------
  qwen3.6-35b:
    role: "スライド / Box 文書の OCR（マルチモーダル）。glm-5.2 は非マルチモーダルのため分離"
    served_model_name: qwen3.6-35b
    endpoint_env: [LOCAL_LLM_URL, RIKYU_URL]
    token_env: [LOCAL_LLM_TOKEN, RIKYU_TOKEN]
    production: true
    verified_at: "2026-08-03"
    verified_by: "model_pin.py --check"
    verified_max_input_tokens: 262144    # /v1/models 実測（2026-08-03）
    verified_max_output_tokens: 262144
    declared_revision: null
    declared_weights_format: null
    declared_trust_remote_code: null
    declared_engine: null
    declared_by: null
    declared_at: null

  Qwen3.6-35B-A3B-FP8:
    role: "スライド / Box 文書の OCR（マルチモーダル、RiVault側）。glm-5.2 は非マルチモーダルのため分離"
    served_model_name: Qwen/Qwen3.6-35B-A3B-FP8
    endpoint_env: [RIVAULT_URL]
    token_env: [RIVAULT_TOKEN]
    production: true
    verified_at: "2026-08-03"
    verified_by: "model_pin.py --check"
    # RiVault の /v1/models は max_input_tokens/max_output_tokens を返さない（2026-08-03実測）。
    verified_max_input_tokens: null
    verified_max_output_tokens: null
    declared_revision: null
    declared_weights_format: null
    declared_trust_remote_code: null
    declared_engine: null
    declared_by: null
    declared_at: null

  # --- 議事録の欠落検出の読み手（recall）専用。議事録生成には使わない -------
  kimi-k3:
    role: >-
      議事録の欠落検出の読み手（recall）専用。議事録生成には使わない
      （PM判断 2026-08-03、用語一致率が glm の 4 割・所要 3.5〜4.2 倍・
      500/504 で 20〜30% 失敗のため）。
    served_model_name: kimi-k3
    endpoint_env: [ARGUS_ONESHOT_LLM_URL, RIKYU_URL]
    token_env: [ARGUS_ONESHOT_LLM_TOKEN, RIKYU_TOKEN]
    production: true
    # ★ production: true は役割を区別しない ★
    # pin が表現できるのは「どのモデルを使ってよいか」だけで、「どの役割で使ってよいか」
    # は表現できない。ここで許可しているのは pm_screen.py --second-opinion-minutes
    # --reader k3（読み手・recall確認）としての利用のみであり、議事録生成に使うことを
    # この pin は防がない。役割の限定は上の role の記述と運用規律に依存する。
    #
    # §4.6 の K3 固有の注意（未解消）: HuggingFace 上で `custom_code` タグ付きで、
    # モデルカードの transformers 使用例は trust_remote_code=True。KDA が新規アーキテクチャ
    # のため transformers 経路では必須になる。**これは §1.3 の攻撃者2に直接該当する
    # 現在形のリスクであり、この pin 変更では解消していない**（declared_trust_remote_code
    # は下記のとおり null のまま）。
    #
    # risk_accepted: 2026-08-03 に PM が「読み手（recall）専用」に限定した上で受容した。
    #   **決定は PM のもの。下記の理由は Claude が提示した分析であり、PM の発言ではない。**
    #   PM の判断の直接の根拠は、実測 3 会議で検出した 19 件の欠落候補を読み、
    #   「載っているべきだった」と確認したこと（日付を伴う約束が 6 件、
    #   マイルストーン期限に関わるものが 2 件を含む）。
    #   Claude が提示した受容の理由:
    #     ① trust_remote_code の危険は「モデルを読み込むプロセスで任意コードが走る」ことだが、
    #        Argus は OpenAI 互換 API のクライアントでモデルを読み込まない。コードが走る
    #        としたら RIKYU 側である。
    #     ② RIKYU は既に kimi-k3 を配信しており、Argus が使うかどうかとは無関係にその
    #        危険は存在する。しかも Argus は同じ RIKYU 上の4モデルに既に依存している。
    #     ③ 供給元への確認は依頼できない（運用上の制約）ため、ゲートを満たす手段が無い。
    #   受容していないもの: K3 の出力が本番データに影響することのリスク（R5/R12）。
    #     そのため読み手（recall確認）に限定し、議事録生成には使わない。
    risk_accepted:
      date: "2026-08-03"
      accepted_by: "PM"
      reason: >-
        ① trust_remote_code の危険は「モデルを読み込むプロセスで任意コードが走る」ことだが、
        Argus は OpenAI 互換 API のクライアントでモデルを読み込まない。コードが走るとしたら
        RIKYU 側である。
        ② RIKYU は既に kimi-k3 を配信しており、Argus が使うかどうかとは無関係にその危険は
        存在する。しかも Argus は同じ RIKYU 上の4モデルに既に依存している。
        ③ 供給元への確認は依頼できない（運用上の制約）ため、ゲートを満たす手段が無い。
      not_accepted: >-
        K3 の出力が本番データに影響することのリスク（R5/R12）。そのため読み手
        （recall確認）に限定し、議事録生成には使わない。
    requires_native_engine: true
    verified_at: "2026-08-01"      # id は実在を確認。ただし engine/trust_remote_code は未確認
    verified_by: "model_pin.py --check"
    verified_max_input_tokens: 928000     # /v1/models 実測（2026-08-01）
    verified_max_output_tokens: 977408
    declared_revision: null
    declared_weights_format: safetensors
    declared_trust_remote_code: null   # ★未確認のまま。確認できていないので確認済みにしない
    declared_engine: null              # ★未確認（vllm または sglang であること）
    declared_by: null
    declared_at: null
