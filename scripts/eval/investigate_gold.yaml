# investigate_gold.yaml — investigate e2e A/B のゴールド質問セット
# reference は judge がカバー率を測る「既知の在窓事実」（recall_gold.yaml 由来）
version: 1
entries:
  - id: benchpark-build-status
    mode: search
    question: "Benchpark の各環境（富岳・FX700・GH200・Genoa・DGX-Spark）でのビルド対応状況は現在どうなっているか？"
    reference: "Benchpark のビルド対応状況（富岳/FX700/GH200/Genoa/DGX-Spark）の進捗報告が存在する"
    since: "2026-03-01"
  - id: frontflow-blue-nvhpc-bug
    mode: search
    question: "FrontFlow/blue の動作に現在問題は発生しているか？あるなら原因と対応状況を教えて"
    reference: "FrontFlow/blue が NVHPC 26.3 のコンパイラバグにより動作しない障害が発生し、NVIDIA へバグレポート提出中"
    since: "2026-05-01"
  - id: genesis-gpu-kernel-bottleneck
    mode: search
    question: "GENESIS の GPU カーネル計測の結果、ボトルネックとして何が特定されたか？"
    reference: "GENESIS で GPU カーネル計測を実施し、ボトルネックとなる主要カーネル3つとそのパラメータを特定"
    since: "2026-05-01"
  - id: salmon-build-issues
    mode: search
    question: "SALMON の各環境でのビルド・実行で発生している問題を整理して"
    reference: "SALMON の FX700/Genoa/DGX 各環境での Spack ビルドにおいて、MPI実行エラー・SLURM実行時の問題・NVHPCリンクエラーが個別に発生"
    since: "2026-05-01"
  - id: benchkit-copyright-policy
    mode: search
    question: "BenchKit への外部コントリビューションの著作権表記ルールはどう決まっているか？"
    reference: "個別ファイルへの著作権表記は不要、PRコミットは要sign-off というルール"
    since: "2026-06-01"
  - id: genesis-license-change
    mode: search
    question: "GENESIS のライセンス変更（LGPL→BSD/MIT）は完了しているか？"
    reference: "ライセンス変更は実際には未完了（AI生成ステータス資料への訂正が存在する）"
    since: "2026-05-01"
  # docqa: --file 全文読込 QA の窓拡大（24k→150k）測定用。対象は約36万字の長文報告書
  # （24k窓では17分割、150k窓では3分割になり、窓分割起因の取りこぼし差が出やすい）。
  # reference は文書内容の事前知識がないため弱い記述に留める — judge は主に
  # 根拠性（出典・数値の明示）と質問への直接性で判定する
  - id: hecbench-report-summary
    mode: docqa
    file: "2025年度 HeCBench ベンチマークの性能評価 報告書.pdf"
    question: "HeCBench ベンチマークの性能評価報告書の要点をまとめて。評価対象の環境と、環境間で性能差（ギャップ）が大きいと報告されたベンチマークがあれば具体的に挙げて"
    reference: "本文に評価環境の一覧と環境間の性能比較の記述が存在する長文報告書"
    since: "2026-01-01"
  - id: hecbench-report-numbers
    mode: docqa
    file: "2025年度 HeCBench ベンチマークの性能評価 報告書.pdf"
    question: "HeCBench 性能評価報告書に記載されている数値結果を横断的に集約し、環境間の性能傾向を整理して"
    reference: "報告書全体に分散した数値表・測定結果の横断集約（文書後半の数値の取りこぼし有無が品質差になる）"
    since: "2026-01-01"
  # mh-*: 多段検索を要する設問（2026-07-30 追加。pm.db から機械抽出 + 在窓性確認済み、
  # PM 承認済み。ドラフト経緯・evidence は data/eval/investigate_gold_candidates.yaml）
  - id: mh-nvl72-external-gpu-saga
    mode: search
    question: "外部GPU計算リソース（NVL72クラス）の確保方針はテストベッド調達の当初決定からどのように変遷し、最終的にどう決着したか？各段階の決定内容を時系列で整理して"
    reference: >
      2025-08-08にテストベッド調達方針（DGX Spark＋NVL4、上限4000万円）が決定された。
      2025-12-25にAWS GB200（NVL72切り出し構成）での性能測定計画が承認されたが、
      2026-03-09の外部計算リソース予算案でNVL72のAWS利用は年2回に削減された。
      2026-07-03のミーティングでKDDIのGB200 NVL72サービス利用は一旦見送りとされたが、
      2026-07-09に一転して前向きに検討する方針となり、2026-07-15〜16にKDDIのGB200 NVL72
      （8トレイ＝32GPU、9/1〜9/14利用）を正式に利用することが決定した。
    since: "2025-08-01"
  - id: mh-3party-nda-evolution
    mode: search
    question: "富岳NEXTの基本設計に関する3者NDA（理研・富士通・NVIDIA間の秘密保持契約）はどのような経緯で締結・確定に至ったか、各段階の合意内容を教えて"
    reference: >
      2026-02-26に富士通主導でNVIDIA側へ働きかけ3者NDAを締結する方針が決定された。
      2026-03-27に3者NDAの文案について三者合意し、Effective Dateを3/13、開示先を
      文科省・内閣府および両省設置委員会のメンバーに限定する条件で確定、署名はDocuSignで
      実施する方針となった。2026-04-06に3者NDAの全者署名が完了し、基本設計技術報告書を
      NVIDIA・富士通へ開示可能となった。2026-10-30には3者NDAの契約期間が
      「基本設計に基づくシステムの運用開始日または2036年3月31日のいずれか早い日まで」と
      確定し、プロジェクト全期間をカバーする方針で3者合意した。
    since: "2025-08-01"
  - id: mh-dgx-spark-rikyu-transition
    mode: search
    question: "DGX Sparkの占有利用方針はどのように推移し、最終的にどのような運用体制に落ち着いたか"
    reference: >
      2026-04-01にDGX Sparkの占有台数について全8台を要求し交渉で調整する方針が決定され、
      2026-04-03の部門定例会議でアプリケーション開発エリア専用としての8台占有利用が承認、
      2026-04-07に8ノードを富岳NEXTグループのみジョブ投入可能とする専有方針が確定した。
      しかし2026-07-16にDGXパークのベンチマークWGによる占有利用は中止され、RIKYUテスト
      環境へ移行することになった。並行してRIKYUのテストベッドGPUリソースは2026-07-09に
      専有利用から共有利用へ移行し富岳NEXT用の優先キューを設定する方針となり、
      2026-07-17以降は制限が撤廃されRIKYUで最大72GPUまで利用可能になったことが
      共有されている。
    since: "2026-03-01"
  - id: mh-ewave-access-framework
    mode: search
    question: "東大地震研のアプリケーションE-Waveについて、NVIDIA・富士通との共有・利用に関する取り決めはどのような経緯で整理されてきたか"
    reference: >
      2025-09-18に東大地震研のE-WaveをNVIDIAへ提供するための該非判定手続き開始が承認され、
      2025-10-10には輸出審査が期限切れとなったEbE-methodの利用を断念し代替としてE-Waveの
      手続きを進める方針となった。2025-11-14には東大・地震研・富士通・NVIDIA・理研の
      4者NDA（3者は閲覧のみ）を締結する方向で合意し、2026-04-22にはE-WaveのBenchkitへの
      組み込みについてコードはプロジェクト内利用に限定し公開しない方針となった。
      2026-07-14には知財問題への対応として、開発者本人をRIKYUの客員としてアカウント取得
      させコード修正を担当させる形で進めることになった。
    since: "2025-09-01"
  - id: mh-lqcd-license-to-network-eval
    mode: search
    question: "LQCD-DWF-HMCはライセンス上の制約をどう解決し、その後どのような評価に組み込まれていったか"
    reference: >
      2025-07-18にSWG6がLQCD-DWF-HMCとMHDTurbulenceを対象アプリケーションとして選定した。
      2026-01-08にカーネル部分を非GPL（MITライセンス）として分離し提供する方針となり、
      2026-01-21にはコアライブラリ部分（GPLライセンス）には手を加えず、lib_alt方式で
      GPU固有コードを分離する方針が確定した。2026-06-11にはLQCD-DWF-HMCをCo-design
      Item 4（スケールアウトネットワーク）評価の最初のケーススタディとすることが決まり、
      2026-07-21には富岳NEXTのコデザインにおけるネットワーク性能評価・ベンチマークの
      対象アプリとして正式に組み込まれた。
    since: "2025-07-01"
  - id: mh-highspeed-link-procurement
    mode: search
    question: "CPU部-加速部間の高速リンク接続案の評価・検証業務は、仕様書確定から契約までどのような手続きを経て進んだか"
    reference: >
      2025-10-28に仕様書案について近藤先生の了解を得た上で、富士通の修正案と法律事務所の
      指摘を反映した最新版（r3）で手続きを進めることが決定された。2025-11-17には契約審査
      委員会が本業務の随意契約を承認し、調達部からの契約手続き連絡・BP対応の準備が
      必要となった。2025-12-09にはセンター会議向け説明資料について、予算額を補正で
      措置される予定の額に変更し、「詳細設計の前倒し実施にともない技術的リスクが
      生じ得る」旨の文言を追加する方針とされ、調達手続き承認のための資料が整備された。
    since: "2025-10-01"
  - id: mh-export-control-handling
    mode: search
    question: "富岳NEXTプロジェクトにおける輸出管理・該非判定の運用はどのように整理されてきたか、具体的な適用事例も含めて教えて"
    reference: >
      2025-09-08に富士通のインド子会社出向者（日本人）のWG参加について、理研側は輸出管理
      審査の実施を条件に承認した。2026-03-19には外為法の該非判定と情報開示の扱いについて、
      富士通から理研への開示はアーキテクチャ以外は非該当・アーキテクチャは該当する場合が
      ある、理研から富士通への開示は包括的に該当する場合があるとして限定しない、という
      運用方針で合意した。2026-05-07にはNCC ASPIRE2Bの利用に伴うハイレベル
      パフォーマンスサマリーの輸出管理について、機械的に取得できるデータ（ジョブレベル
      メトリック）の収集を先行しつつ、並行して安全保障輸出管理の手続きを進める方針となった。
    since: "2025-09-01"
  - id: mh-benchpark-benchkit-integration-policy
    mode: search
    question: "BenchkitとBenchparkの統合・公開方針はどのように整理され、最終的にどのような運用ルールに落ち着いたか"
    reference: >
      2025-09-22にはbenchkitの作成・整備作業を一時中断しTWI（Technical Work Item）の
      策定と上層承認を優先する方針が決定された。2026-03-19にはBenchkitとBenchparkの
      統合方針として、両対応可能なものはBenchparkに統一する方針となり、2026-04-08には
      CXフレームワーク（Benchkit、Benchpark）のEEA登録を進め8月末〜9月初頭にα版を
      公開する方針が決まった。2026-06-15にはBenchkit/Benchparkへのベンチマーク統合
      プロセスについて、個別承認を不要としPRの提出とサインオフのみで統合可能とする
      運用方針が決定された。
    since: "2025-09-01"
  - id: mh-genesis-to-gromacs-proxy-shift
    mode: search
    question: "GENESISは富岳NEXTのコデザイン評価においてどのような役割を期待されていたが、その後どのように扱いが変わったか"
    reference: >
      2025-11-01にNVIDIAによるコデザイン向け測定対象アプリを当初の優先2アプリから
      ドメイン横断6アプリ（GENESIS, SALMON, SCALE, E-Wave, FrontFlow/blue, LQCD）に
      拡大することで合意し、2025-11-07には6アプリの中でも準備が整ったGENESISから
      NVIDIAへのプロファイル測定依頼に着手する方針とされた。しかし2026-02-16の会議では
      コデザイン目的のベンチマークには現行のGENESISではなくGROMACSをプロキシ
      アプリケーションとして活用する方針に転換し、2026-02-19にはGENESISへの
      プロジェクトリソース投入を抑制する一方、ベンチマークリポジトリからは完全削除せず
      公開バージョン2.1.6ベースでのデータ取得は継続する方針となった。
    since: "2025-10-01"
